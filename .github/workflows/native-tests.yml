name: "Native tests"
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
jobs:
  test:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      "EXPECTED_HEAD": "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          persist-credentials: false
      - name: "Verify exact head"
        run: |2
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_HEAD" ]; then
            echo "HEAD $actual != EXPECTED_HEAD $EXPECTED_HEAD" >&2
            exit 1
          fi
          { echo "SHA: $actual"; echo "Runner OS: $RUNNER_OS"; echo "Run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"; } >> "$GITHUB_STEP_SUMMARY"
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: "Set up Node"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.3"
      - name: "Run Python evidence tests"
        run: |2
          python scripts/test_evidence.py
      - name: "Run Node tests"
        run: |2
          node --test tests/test_state.cjs tests/test_review_state.cjs
      - name: "Report"
        if: "always()"
        run: |2
          echo 'Test counts are native runner-reported in the job logs. Missing, zero, skipped or error results are not passing. This line does not enforce counts.' >> "$GITHUB_STEP_SUMMARY"
